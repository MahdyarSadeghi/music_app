<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>موزیک</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
      </svg>
      <span>موزیک</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-section="home">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        خانه
      </a>
      <a href="#" class="nav-item" data-section="search">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        جستجو
      </a>
      <a href="#" class="nav-item" data-section="library">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
        کتابخانه
      </a>
    </nav>

    <div class="sidebar-section">
      <p class="sidebar-label">پلی‌لیست‌ها</p>
      <a href="#" class="playlist-item" id="uploadTrigger">
        <span class="plus-icon">＋</span> آهنگ جدید
      </a>
      <div id="sidebarPlaylists"></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Top bar -->
    <div class="topbar">
      <div class="topbar-actions">
        <button class="topbar-btn" id="openUploadModal">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          آپلود آهنگ
        </button>
      </div>
    </div>

    <!-- Home section -->
    <section id="section-home" class="content-section active">
      <h2 class="section-title">جدیدترین‌ها</h2>
      <div class="songs-grid" id="songsGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <h2 class="section-title" style="margin-top:2.5rem">همه آهنگ‌ها</h2>
      <div class="track-list" id="trackList"></div>
    </section>

    <!-- Search section -->
    <section id="section-search" class="content-section">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="دنبال چی می‌گردی؟" />
      </div>
      <div class="track-list" id="searchResults"></div>
    </section>

    <!-- Library section -->
    <section id="section-library" class="content-section">
      <h2 class="section-title">کتابخانه</h2>
      <div class="track-list" id="libraryList"></div>
    </section>
  </main>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>آپلود آهنگ جدید</h3>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <form id="uploadForm">
        <input type="text" id="titleInput" placeholder="نام آهنگ" required />
        <input type="text" id="artistInput" placeholder="نام خواننده" required />
        <label class="file-drop" id="fileDrop">
          <input type="file" id="audioFile" accept=".mp3" required />
          <svg viewBox="0 0 24 24" fill="currentColor" width="36" height="36"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
          <span id="fileDropLabel">فایل MP3 را اینجا بکشید یا کلیک کنید</span>
        </label>
        <button type="submit" id="uploadBtn">آپلود</button>
        <p id="uploadMsg" class="upload-msg"></p>
      </form>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-nav">
    <a href="#" class="mobile-nav-item active" data-section="home">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>خانه</span>
    </a>
    <a href="#" class="mobile-nav-item" data-section="search">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>جستجو</span>
    </a>
    <a href="#" class="mobile-nav-item" data-section="library">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      <span>کتابخانه</span>
    </a>
    <a href="#" class="mobile-nav-item" id="mobileUploadTrigger">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>آپلود</span>
    </a>
  </nav>

  <!-- Bottom Player -->
  <div class="player-bar" id="playerBar">
    <!-- mobile mini progress (top of player bar) -->
    <div class="mini-progress" id="miniProgress">
      <div class="mini-progress-fill" id="miniProgressFill"></div>
    </div>
    <div class="player-song-info">
      <div class="player-cover" id="playerCover">
        <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div>
        <p class="player-title" id="playerTitle">—</p>
        <p class="player-artist" id="playerArtist">—</p>
      </div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" title="قبلی">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="بعدی">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="player-progress-wrap">
      <span class="time" id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <span class="time" id="totalTime">0:00</span>
    </div>

    <div class="player-volume">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.8" />
    </div>
  </div>

  <audio id="audioEl"></audio>
  <script src="/static/js/app.js"></script>
</body>
</html>
